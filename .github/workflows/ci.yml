name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # One version failing is the interesting part; don't hide the others.
      fail-fast: false
      matrix:
        # Every version package.json's `engines.node` claims to support.
        node: ['20', '22', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Last: the published artefact is dist/, so a green suite over source
      # that does not compile would still be a broken release.
      - run: npm run build
